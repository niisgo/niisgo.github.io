<section class="hero" id="hero" [class.visible]="visible()">

  <div class="hero__left">
    <p class="hero__eyebrow">Software Developer · Münster, NRW</p>

    <h1 class="hero__headline">
      <span class="hero__headline-line">Ich schreib</span>
      <span class="hero__headline-line hero__headline-line--accent">Code,</span>
      <span class="hero__headline-line">der läuft.</span>
    </h1>

    <p class="hero__sub">
      Azubi Fachinformatiker Anwendungsentwicklung
      bei&nbsp;<a href="https://www.bluesolution.de" target="_blank" rel="noopener" class="hero__company">blue&nbsp;solution</a> in Rheine.
      Full-Stack mit Vorliebe für saubere Architektur
      und schnelle Interfaces.
    </p>

    <div class="hero__actions">
      <a href="mailto:nicotillmann10@gmail.com" class="hero__btn hero__btn--primary">
        Schreib mir
      </a>
      <a href="https://github.com/niisgo" target="_blank" rel="noopener" class="hero__btn hero__btn--ghost">
        GitHub ↗
      </a>
    </div>

    <div class="hero__meta">
      <div class="hero__meta-item">
        <span class="hero__meta-dot"></span>
        Verfügbar für Projekte
      </div>
      <div class="hero__meta-divider"></div>
      <div class="hero__meta-item">blue solution · seit 2023</div>
    </div>
  </div>

  <div class="hero__right">
    <div class="hero__photo-wrap">
      <img
        src="assets/photo.png"
        alt="Nico Tillmann"
        class="hero__photo"
        loading="eager"
        (error)="onImgError($event)"
      />
      <div class="hero__photo-placeholder" id="photo-fallback">
        <span>NT</span>
      </div>
    </div>
  </div>

</section>
